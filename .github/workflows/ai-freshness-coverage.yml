name: AI Freshness Coverage

on:
  pull_request:
  # Pages is deployed after CI completes. Probe after that deployment rather
  # than on the preceding push, otherwise the check races the CDN and reports
  # a false release-SHA mismatch.
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
  schedule:
    # Pages refresh runs at :17. Probe later so CDN propagation has time to settle.
    - cron: '47 * * * *'

jobs:
  freshness:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate freshness coverage analyzer
        run: |
          node --check scripts/analyze-ai-freshness-coverage.mjs
          node scripts/analyze-ai-freshness-coverage.mjs --self-test
          node --check scripts/validate-live-release-coherence.mjs
          node scripts/validate-live-release-coherence.mjs --self-test
          node --check scripts/validate-release-receipt.mjs
          node scripts/validate-release-receipt.mjs --self-test
      - name: Probe live real dashboard coverage
        # A PR cannot guarantee that its code is deployed yet, so live drift is advisory
        # there. On main, manual runs, and the hourly watchdog, stale public data must fail.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          DASHBOARD_URL: https://linyuxuanlin.github.io/internet-trend-radar/data/dashboard.json
          FETCH_TIMEOUT_MS: 15000
          MAX_DASHBOARD_AGE_HOURS: 3
        run: |
          node scripts/analyze-ai-freshness-coverage.mjs
      - name: Probe live release coherence
        # Verify that all public JSON assets are from one real deployment, not a split CDN cache,
        # and that strict main/scheduled probes are serving the exact commit that triggered this run.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          DASHBOARD_URL: https://linyuxuanlin.github.io/internet-trend-radar/data/dashboard.json
          HEALTH_URL: https://linyuxuanlin.github.io/internet-trend-radar/data/health.json
          OPPORTUNITIES_URL: https://linyuxuanlin.github.io/internet-trend-radar/data/opportunities.json
          EXPECTED_BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          FETCH_TIMEOUT_MS: 15000
          MAX_RELEASE_AGE_MS: 10800000
        run: |
          node scripts/validate-live-release-coherence.mjs
      - name: Probe live release receipt
        # The receipt is a compact, cache-busted proof of what the public deployment actually contains.
        # It stays advisory on PRs until that code is deployed, and strict everywhere else.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          RELEASE_URL: https://linyuxuanlin.github.io/internet-trend-radar/data/release.json
          EXPECTED_BUILD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          FETCH_TIMEOUT_MS: 15000
          MAX_RELEASE_AGE_MS: 10800000
        run: |
          node scripts/validate-release-receipt.mjs
