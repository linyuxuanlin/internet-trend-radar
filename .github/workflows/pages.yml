name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build real trend snapshot
        run: |
          node scripts/build-static-dashboard.mjs
          node scripts/enrich-static-dashboard.mjs

      - name: Patch Pages frontend fallback
        run: node scripts/patch-pages-index.mjs

      - name: Verify snapshot is real
        run: |
          node -e "const d=require('./public/data/dashboard.json'); if(d.preview!==false||d.ready!==true||!Array.isArray(d.topics)||d.topics.length===0) process.exit(1); console.log('real topics:',d.topics.length,'healthy sources:',d.sources.filter(s=>s.last_success_at).length,'direct cn:',d.sources.filter(s=>s.region==='cn'&&s.last_success_at&&['official-api','official-rss'].includes(s.kind)).map(s=>s.id).join(','))"

      - name: Add Coffee Lab mobile MVPs
        run: |
          mkdir -p public/coffee-mvps
          cp coffee-mvps/index.html public/coffee-mvps/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy
        uses: actions/deploy-pages@v4
