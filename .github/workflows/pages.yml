name: Deploy GitHub Pages

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_SHA }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build real trend snapshot
        env:
          REQUIRED_DIRECT_CN: v2ex,sspai,bilibili,36kr,juejin,baidu,toutiao,hupu,ithome,solidot
          REQUIRED_SOCIAL_SOURCES: weibo,zhihu
          OPTIONAL_SOCIAL_SOURCES: douyin
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          node scripts/build-static-dashboard.mjs
          REQUIRE_SSPAI=1 REQUIRE_BILIBILI=1 node scripts/enrich-static-dashboard.mjs
          REQUIRE_36KR=1 node scripts/enrich-36kr.mjs
          REQUIRE_JUEJIN=1 node scripts/enrich-juejin.mjs
          REQUIRE_BAIDU=1 node scripts/enrich-baidu.mjs
          REQUIRE_TOUTIAO=1 node scripts/enrich-toutiao.mjs
          REQUIRE_HUPU=1 node scripts/enrich-hupu.mjs
          REQUIRE_ITHOME=1 node scripts/enrich-ithome.mjs
          REQUIRE_SOLIDOT=1 node scripts/enrich-solidot.mjs
          node scripts/enrich-social-hotlists.mjs
          node scripts/probe-degraded-sources.mjs
          node scripts/normalize-source-summaries.mjs
          node scripts/enrich-ai-opportunities.mjs
          BUILD_SHA="$TARGET_SHA" node scripts/stamp-build-provenance.mjs
          node scripts/write-opportunities.mjs
          node scripts/write-health-manifest.mjs
      - name: Verify production real-data and AI gates
        env:
          REQUIRED_DIRECT_CN: v2ex,sspai,bilibili,36kr,juejin,baidu,toutiao,hupu,ithome,solidot
        run: |
          MIN_HEALTHY_SOURCES=14 MIN_DIRECT_CN_SOURCES=10 node scripts/validate-real-dashboard.mjs
          node scripts/validate-opportunities.mjs
          node scripts/validate-ai-assets.mjs
          node scripts/validate-ai-quality.mjs
          EXPECTED_BUILD_SHA="$TARGET_SHA" node scripts/validate-build-provenance.mjs
          EXPECTED_BUILD_SHA="$TARGET_SHA" node scripts/validate-health-manifest.mjs
      - name: Patch Pages frontend
        run: |
          node scripts/patch-pages-index.mjs
          node scripts/patch-ai-opportunities-panel.mjs
      - name: Add Coffee Lab mobile MVPs
        run: |
          mkdir -p public/coffee-mvps
          cp coffee-mvps/index.html public/coffee-mvps/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Pages snapshot
        timeout-minutes: 3
        env:
          DASHBOARD_URL: ${{ steps.deployment.outputs.page_url }}data/dashboard.json
          HEALTH_URL: ${{ steps.deployment.outputs.page_url }}data/health.json
          OPPORTUNITIES_URL: ${{ steps.deployment.outputs.page_url }}data/opportunities.json
          EXPECTED_BUILD_SHA: ${{ env.TARGET_SHA }}
          MIN_HEALTHY_SOURCES: '14'
          MIN_DIRECT_CN_SOURCES: '10'
          REQUIRED_DIRECT_CN: v2ex,sspai,bilibili,36kr,juejin,baidu,toutiao,hupu,ithome,solidot
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node scripts/validate-real-dashboard.mjs && node scripts/validate-build-provenance.mjs && node scripts/validate-health-manifest.mjs && node scripts/validate-opportunities-live.mjs && node scripts/validate-ai-assets.mjs && node scripts/validate-ai-quality.mjs; then
              exit 0
            fi
            [ "$attempt" -lt 6 ] && sleep 10
          done
          exit 1
