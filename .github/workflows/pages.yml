name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build real trend snapshot
        env:
          REQUIRED_DIRECT_CN: v2ex,sspai,bilibili,36kr,juejin,baidu,toutiao,hupu
        run: |
          node scripts/build-static-dashboard.mjs
          REQUIRE_SSPAI=1 REQUIRE_BILIBILI=1 node scripts/enrich-static-dashboard.mjs
          REQUIRE_36KR=1 node scripts/enrich-36kr.mjs
          REQUIRE_JUEJIN=1 node scripts/enrich-juejin.mjs
          REQUIRE_BAIDU=1 node scripts/enrich-baidu.mjs
          REQUIRE_TOUTIAO=1 node scripts/enrich-toutiao.mjs
          REQUIRE_HUPU=1 node scripts/enrich-hupu.mjs
          BUILD_SHA="$GITHUB_SHA" node scripts/stamp-build-provenance.mjs
          node scripts/write-health-manifest.mjs

      - name: Verify production real-data gate
        env:
          REQUIRED_DIRECT_CN: v2ex,sspai,bilibili,36kr,juejin,baidu,toutiao,hupu
        run: |
          MIN_HEALTHY_SOURCES=10 MIN_DIRECT_CN_SOURCES=8 node scripts/validate-real-dashboard.mjs
          EXPECTED_BUILD_SHA="$GITHUB_SHA" node scripts/validate-build-provenance.mjs
          EXPECTED_BUILD_SHA="$GITHUB_SHA" node scripts/validate-health-manifest.mjs

      - name: Patch Pages frontend fallback
        run: node scripts/patch-pages-index.mjs

      - name: Add Coffee Lab mobile MVPs
        run: |
          mkdir -p public/coffee-mvps
          cp coffee-mvps/index.html public/coffee-mvps/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live Pages real-data snapshot
        timeout-minutes: 3
        env:
          DASHBOARD_URL: ${{ steps.deployment.outputs.page_url }}data/dashboard.json
          HEALTH_URL: ${{ steps.deployment.outputs.page_url }}data/health.json
          MIN_HEALTHY_SOURCES: '10'
          MIN_DIRECT_CN_SOURCES: '8'
          REQUIRED_DIRECT_CN: v2ex,sspai,bilibili,36kr,juejin,baidu,toutiao,hupu
          EXPECTED_BUILD_SHA: ${{ github.sha }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            echo "Live snapshot verification attempt ${attempt}/6: ${DASHBOARD_URL}"
            if node scripts/validate-real-dashboard.mjs && node scripts/validate-build-provenance.mjs && node scripts/validate-health-manifest.mjs; then
              exit 0
            fi
            if [ "$attempt" -lt 6 ]; then
              sleep 10
            fi
          done
          echo "Published Pages dashboard/health manifest never passed real-data and commit-provenance gates" >&2
          exit 1
