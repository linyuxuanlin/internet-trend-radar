name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Build real trend snapshot
        run: |
          node scripts/build-static-dashboard.mjs
          REQUIRE_SSPAI=1 REQUIRE_BILIBILI=1 node scripts/enrich-static-dashboard.mjs

      - name: Verify production real-data gate
        run: node scripts/validate-real-dashboard.mjs

      - name: Patch Pages frontend fallback
        run: node scripts/patch-pages-index.mjs

      - name: Add Coffee Lab mobile MVPs
        run: |
          mkdir -p public/coffee-mvps
          cp coffee-mvps/index.html public/coffee-mvps/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy
        uses: actions/deploy-pages@v4
