name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          find scripts -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
          python3 - <<'PY' > /tmp/frontend.js
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text()
          blocks=re.findall(r'<script>([\s\S]*?)</script>',s)
          print('\n'.join(blocks))
          PY
          node --check /tmp/frontend.js

      - name: Validate Pages patch
        run: |
          cp public/index.html /tmp/index.html
          node scripts/patch-pages-index.mjs
          python3 - <<'PY' > /tmp/frontend-pages.js
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text()
          blocks=re.findall(r'<script>([\s\S]*?)</script>',s)
          print('\n'.join(blocks))
          PY
          node --check /tmp/frontend-pages.js
          mv /tmp/index.html public/index.html

      - name: Real-data smoke test
        timeout-minutes: 4
        run: |
          node scripts/build-static-dashboard.mjs
          REQUIRE_SSPAI=1 REQUIRE_BILIBILI=1 node scripts/enrich-static-dashboard.mjs
          node - <<'NODE'
          const d = require('./public/data/dashboard.json');
          const healthy = (d.sources || []).filter(s => s.last_success_at);
          const directCn = healthy.filter(s => s.region === 'cn' && ['official-api', 'official-rss'].includes(s.kind));
          if (d.preview !== false) throw new Error('preview must be false');
          if (d.ready !== true) throw new Error('ready must be true');
          if (!Array.isArray(d.topics) || d.topics.length === 0) throw new Error('no real topics');
          if (healthy.length === 0) throw new Error('no healthy real sources');
          if (directCn.length < 3) throw new Error(`need >=3 healthy direct Chinese sources; got ${directCn.map(s => s.id).join(',')}`);
          if (!directCn.some(s => s.id === 'sspai')) throw new Error('SSPAI direct RSS source is not healthy');
          if (!directCn.some(s => s.id === 'bilibili')) throw new Error('Bilibili direct popular source is not healthy');
          console.log(`verified real topics=${d.topics.length}, healthySources=${healthy.length}, directCn=${directCn.map(s => s.id).join(',')}`);
          NODE
