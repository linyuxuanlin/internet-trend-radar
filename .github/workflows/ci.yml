name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Syntax check
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 - <<'PY' > /tmp/frontend.js
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text()
          blocks=re.findall(r'<script>([\s\S]*?)</script>',s)
          print('\n'.join(blocks))
          PY
          node --check /tmp/frontend.js
