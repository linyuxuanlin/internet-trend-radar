name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          find scripts -name '*.mjs' -print0 | xargs -0 -r -n1 node --check
          python3 - <<'PY' > /tmp/frontend.js
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text()
          blocks=re.findall(r'<script>([\s\S]*?)</script>',s)
          print('\n'.join(blocks))
          PY
          node --check /tmp/frontend.js

      - name: Validate worker diagnostics and source fallback
        timeout-minutes: 2
        run: |
          node scripts/validate-d1-schema-bootstrap.mjs
          node scripts/validate-worker-diagnostics.mjs
          node scripts/validate-ai-blocked-reasons.mjs
          node scripts/validate-ai-backfill.mjs
          node scripts/validate-ai-error-fingerprints.mjs
          node scripts/validate-scheduled-ai-backfill.mjs
          node scripts/validate-ai-model-diagnostics.mjs
          node scripts/validate-production-preview-guard.mjs
          node scripts/validate-dailyhot-fallback.mjs
          node scripts/validate-dailyhot-live.mjs
          node scripts/validate-provenance-integrity.mjs
          node scripts/validate-capture-time-window.mjs
          node scripts/validate-source-metric-semantics.mjs
          node scripts/validate-published-time-normalization.mjs
          node scripts/validate-upstream-metric-nullability.mjs
          node scripts/validate-data-quality-null-semantics.mjs
          node scripts/validate-disabled-source-isolation.mjs
          node scripts/validate-evidence-freshness.mjs
          node scripts/validate-email-freshness.mjs
          node scripts/validate-upstream-kind-labels.mjs
          node scripts/validate-score-integrity.mjs
          node scripts/validate-source-freshness-scoring.mjs
          node scripts/validate-frontend-freshness.mjs
          node scripts/validate-static-asset-freshness.mjs

      - name: Probe live Worker AI diagnostics
        timeout-minutes: 1
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        env:
          AI_DEBUG_URL: https://internet-trend-radar.linyuxuanlin.workers.dev/api/debug
        run: |
          status=$(curl --silent --show-error --max-time 15 --output /tmp/ai-debug.json --write-out '%{http_code}' "$AI_DEBUG_URL" || true)
          echo "Live AI debug HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "::warning::Live Worker diagnostics unavailable (HTTP $status); keeping CI truthful without synthetic AI data"
            cat /tmp/ai-debug.json 2>/dev/null || true
            exit 0
          fi
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/ai-debug.json', 'utf8'));
          if (!d.ai || typeof d.ai !== 'object') throw new Error('live /api/debug missing ai diagnostics');
          const required = ['binding','eligible_topics','attempted_topics','verified_topics','pending_topics','stale_topics','ready_for_inference','blocked_reason'];
          for (const key of required) if (!(key in d.ai)) throw new Error(`live /api/debug missing ai.${key}`);
          const attemptFields = ['recent_attempts_24h','recent_successes_24h','recent_failures_24h','recent_failure_reasons'];
          const deployedHasAttemptDiagnostics = attemptFields.every(key => key in d.ai);
          if (!deployedHasAttemptDiagnostics) {
            console.log('::warning::Deployed Worker predates AI attempt diagnostics; this PR will require these fields after deployment');
          }
          if (!Array.isArray(d.ai.model_stats_24h)) {
            console.log('::warning::Deployed Worker predates per-model AI diagnostics; this PR will expose model_stats_24h after deployment');
          }
          const allowed = new Set([null,'missing-ai-and-db-binding','missing-db-binding','d1-schema-incomplete','d1-schema-probe-failed','missing-ai-binding','no-eligible-topics','inference-not-run','outputs-failed-quality-gate','partial-ai-coverage','daily-ai-quota-exhausted','provider-daily-quota-exhausted','daily-ai-budget-exhausted','daily-ai-budget-paced','ai-readiness-query-failed']);
          if (!allowed.has(d.ai.blocked_reason)) throw new Error(`unknown live blocker: ${d.ai.blocked_reason}`);
          if ('effective_blocker' in d.ai && d.ai.blocked_reason !== d.ai.effective_blocker) {
            throw new Error(`live blocker drift: blocked_reason=${d.ai.blocked_reason} effective_blocker=${d.ai.effective_blocker}`);
          }
          if ('available' in d.ai && Boolean(d.ai.ready_for_inference) !== Boolean(d.ai.available)) {
            throw new Error(`live readiness drift: ready_for_inference=${d.ai.ready_for_inference} available=${d.ai.available}`);
          }
          const snapshot = {
            schema: d.schema ? {
              ok: d.schema.ok,
              error: d.schema.error,
              tables: d.schema.tables,
              bootstrap_attempted: d.schema.bootstrap_attempted,
              bootstrap_ok: d.schema.bootstrap_ok,
              bootstrap_error_code: d.schema.bootstrap_error_code ?? null,
              bootstrap_error: d.schema.bootstrap_error ?? null,
              bootstrap_failed_statement_index: d.schema.bootstrap_failed_statement_index ?? null,
              bootstrap_statement_count: d.schema.bootstrap_statement_count ?? null,
              bootstrap_failed_statement: d.schema.bootstrap_failed_statement ?? null,
              bootstrap_cause: d.schema.bootstrap_cause ?? null
            } : null,
            ai: {
              binding: d.ai.binding,
              model: d.ai.model,
              eligible_topics: d.ai.eligible_topics,
              attempted_topics: d.ai.attempted_topics,
              verified_topics: d.ai.verified_topics,
              pending_topics: d.ai.pending_topics,
              stale_topics: d.ai.stale_topics,
              ready_for_inference: d.ai.ready_for_inference,
              blocked_reason: d.ai.blocked_reason,
              effective_blocker: d.ai.effective_blocker ?? null,
              available: d.ai.available ?? null,
              availability_ok: d.ai.availability_ok ?? null,
              provider_quota: d.ai.provider_quota ?? null,
              pacing: d.ai.pacing ?? null,
              recent_attempts_24h: d.ai.recent_attempts_24h ?? null,
              recent_successes_24h: d.ai.recent_successes_24h ?? null,
              recent_failures_24h: d.ai.recent_failures_24h ?? null,
              recent_failure_reasons: d.ai.recent_failure_reasons ?? null,
              model_stats_24h: d.ai.model_stats_24h ?? null
            }
          };
          console.log(JSON.stringify(snapshot, null, 2));
          if (d.ai.blocked_reason === 'd1-schema-incomplete') {
            const detail = d.schema?.bootstrap_error || d.schema?.error || 'no bootstrap detail exposed by deployed Worker';
            console.log(`::warning::Production D1 schema is incomplete: ${String(detail).replace(/\r?\n/g, ' ')}`);
          }
          NODE

      - name: Validate Pages patch
        run: |
          cp public/index.html /tmp/index.html
          node scripts/patch-pages-index.mjs
          node scripts/patch-ai-opportunities-panel.mjs
          grep -q "snapshot stale" public/index.html
          grep -q "3\*60\*60\*1000" public/index.html
          grep -q "https://radar.wiki-power.com/api/dashboard" public/index.html
          grep -q 'id="ai-opportunities-panel"' public/index.html
          python3 - <<'PY' > /tmp/frontend-pages.js
          from pathlib import Path
          import re
          s=Path('public/index.html').read_text()
          blocks=re.findall(r'<script>([\s\S]*?)</script>',s)
          print('\n'.join(blocks))
          PY
          node --check /tmp/frontend-pages.js
          mv /tmp/index.html public/index.html

      - name: Real-data smoke test
        timeout-minutes: 8
        env:
          REQUIRED_DIRECT_CN: v2ex,sspai,bilibili,36kr,juejin,baidu,toutiao,hupu,ithome,solidot
          REQUIRED_SOCIAL_SOURCES: weibo,zhihu
          OPTIONAL_SOCIAL_SOURCES: douyin
          GITHUB_API_TOKEN: ${{ github.token }}
          AI_SOURCE_URL: https://feat-pages-ai-opportunity-overlay-internet-trend-radar.linyuxuanlin.workers.dev/api/dashboard
        run: |
          node scripts/validate-rss-source-freshness.mjs
          node scripts/build-static-dashboard.mjs
          REQUIRE_SSPAI=1 REQUIRE_BILIBILI=1 node scripts/enrich-static-dashboard.mjs
          REQUIRE_36KR=1 node scripts/enrich-36kr.mjs
          REQUIRE_JUEJIN=1 node scripts/enrich-juejin.mjs
          REQUIRE_BAIDU=1 node scripts/enrich-baidu.mjs
          REQUIRE_TOUTIAO=1 node scripts/enrich-toutiao.mjs
          REQUIRE_HUPU=1 node scripts/enrich-hupu.mjs
          REQUIRE_ITHOME=1 node scripts/enrich-ithome.mjs
          REQUIRE_SOLIDOT=1 node scripts/enrich-solidot.mjs
          node scripts/enrich-social-hotlists.mjs
          node scripts/probe-degraded-sources.mjs
          node scripts/normalize-source-summaries.mjs
          node scripts/normalize-static-provenance.mjs
          node scripts/validate-static-provenance.mjs
          node scripts/enrich-ai-opportunities.mjs
          BUILD_SHA="$GITHUB_SHA" node scripts/stamp-build-provenance.mjs
          node scripts/write-opportunities.mjs
          node scripts/write-health-manifest.mjs
          MIN_HEALTHY_SOURCES=14 MIN_DIRECT_CN_SOURCES=10 node scripts/validate-real-dashboard.mjs
          node scripts/validate-opportunities.mjs
          node scripts/validate-ai-assets.mjs
          node scripts/validate-ai-quality.mjs
          EXPECTED_BUILD_SHA="$GITHUB_SHA" node scripts/validate-build-provenance.mjs
          EXPECTED_BUILD_SHA="$GITHUB_SHA" node scripts/validate-health-manifest.mjs

      - name: Smoke-test remote dashboard validation
        timeout-minutes: 1
        env:
          REQUIRED_DIRECT_CN: v2ex,sspai,bilibili,36kr,juejin,baidu,toutiao,hupu,ithome,solidot
        run: |
          python3 -m http.server 4173 --directory public >/tmp/radar-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent http://127.0.0.1:4173/data/dashboard.json >/dev/null && curl --fail --silent http://127.0.0.1:4173/data/health.json >/dev/null && curl --fail --silent http://127.0.0.1:4173/data/opportunities.json >/dev/null; then
              break
            fi
            sleep 1
          done
          DASHBOARD_URL=http://127.0.0.1:4173/data/dashboard.json MIN_HEALTHY_SOURCES=14 MIN_DIRECT_CN_SOURCES=10 node scripts/validate-real-dashboard.mjs
          DASHBOARD_URL=http://127.0.0.1:4173/data/dashboard.json EXPECTED_BUILD_SHA="$GITHUB_SHA" node scripts/validate-build-provenance.mjs
          DASHBOARD_URL=http://127.0.0.1:4173/data/dashboard.json HEALTH_URL=http://127.0.0.1:4173/data/health.json EXPECTED_BUILD_SHA="$GITHUB_SHA" node scripts/validate-health-manifest.mjs
          OPPORTUNITIES_URL=http://127.0.0.1:4173/data/opportunities.json EXPECTED_BUILD_SHA="$GITHUB_SHA" node scripts/validate-opportunities-live.mjs
