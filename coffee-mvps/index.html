<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3efe6"><title>Coffee Lab · Mobile MVPs</title><style>html,body{margin:0;min-height:100%;background:#f3efe6;color:#173828;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{min-height:100svh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}.card{max-width:420px}.dot{width:10px;height:10px;border-radius:50%;background:#1d5a3b;margin:0 auto 16px;animation:p 1.1s infinite alternate}@keyframes p{to{opacity:.2;transform:scale(.7)}}h1{font:500 34px/1 Georgia,serif;margin:0 0 12px}p{color:#6d746e;line-height:1.6}</style></head><body><main><div class="card"><div class="dot"></div><h1>Coffee Lab</h1><p id="s">正在加载 15 个咖啡 MVP…</p></div></main><script>(async()=>{try{const u='https://raw.githubusercontent.com/linyuxuanlin/Single_Page/master/coffee-mvps/index.html?v='+Date.now();const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const h=await r.text();document.open();document.write(h);document.close()}catch(e){document.getElementById('s').innerHTML='加载失败，请刷新重试。<br><small>'+String(e.message||e)+'</small>'}})()</script></body></html>
