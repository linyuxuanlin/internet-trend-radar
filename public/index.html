<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Trend Radar</title>
  <style>
    :root{--bg:#f5f7fb;--panel:#fff;--text:#111827;--muted:#6b7280;--border:#e5e7eb;--accent:#2563eb;--accent2:#7c3aed;--good:#059669;--warn:#d97706;--hot:#dc2626;--chip:#eef2ff}
    @media(prefers-color-scheme:dark){:root{--bg:#0b1020;--panel:#111827;--text:#f3f4f6;--muted:#9ca3af;--border:#253047;--accent:#60a5fa;--accent2:#a78bfa;--good:#34d399;--warn:#fbbf24;--hot:#f87171;--chip:#18233a}}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1220px;margin:auto;padding:22px}.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}.brand h1{margin:0;font-size:28px}.sub{color:var(--muted);margin-top:6px;font-size:14px}.live{display:flex;gap:7px;align-items:center;color:var(--good);font-size:13px}.dot{width:8px;height:8px;border-radius:50%;background:currentColor;box-shadow:0 0 0 4px color-mix(in srgb,currentColor 15%,transparent)}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.toolbar button{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:999px;padding:8px 12px;cursor:pointer}.toolbar button.active{background:var(--accent);border-color:var(--accent);color:white}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric,.panel{background:var(--panel);border:1px solid var(--border);border-radius:16px}.metric{padding:15px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:25px;margin-top:5px}.main-grid{display:grid;grid-template-columns:1.45fr .75fr;gap:14px;margin-top:14px}.panel{padding:16px}.panel h2{font-size:16px;margin:0 0 12px}.chart{height:230px;width:100%;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.axis{stroke:var(--border);stroke-width:1}.line1{fill:none;stroke:var(--accent);stroke-width:3}.line2{fill:none;stroke:var(--accent2);stroke-width:2;stroke-dasharray:5 5}.chart-label{fill:var(--muted);font-size:11px}.legend{display:flex;gap:14px;color:var(--muted);font-size:12px;margin-top:8px}.legend i{width:10px;height:3px;display:inline-block;margin-right:5px;vertical-align:middle;background:var(--accent)}.legend .b i{background:var(--accent2)}
    .bars{display:grid;gap:10px}.bar-row{display:grid;grid-template-columns:72px 1fr 34px;gap:9px;align-items:center;font-size:13px}.track{height:9px;background:color-mix(in srgb,var(--border) 70%,transparent);border-radius:999px;overflow:hidden}.fill{height:100%;border-radius:inherit;background:var(--accent)}.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.trend-list{display:grid;gap:9px}.trend{padding:12px;border:1px solid var(--border);border-radius:13px;cursor:pointer;background:color-mix(in srgb,var(--panel) 96%,var(--accent) 4%)}.trend:hover{border-color:color-mix(in srgb,var(--accent) 55%,var(--border))}.trend-top{display:flex;gap:8px;justify-content:space-between}.trend-title{font-weight:600;line-height:1.4}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.chip{font-size:11px;padding:4px 7px;border-radius:999px;background:var(--chip);color:var(--muted)}.chip.hot{color:var(--hot)}.chip.rise{color:var(--warn)}.summary{font-size:13px;color:var(--muted);line-height:1.5;margin-top:7px}.opp{margin-top:9px;padding-top:8px;border-top:1px dashed var(--border);font-size:13px;line-height:1.5}.opp b{color:var(--good)}
    .sources{display:grid;gap:8px}.source{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}.source:last-child{border:0}.status{font-size:12px}.status.ok{color:var(--good)}.status.bad{color:var(--hot)}.status.wait{color:var(--muted)}
    dialog{border:1px solid var(--border);border-radius:18px;background:var(--panel);color:var(--text);width:min(760px,calc(100% - 24px));max-height:86vh;padding:0}.modal-head{display:flex;justify-content:space-between;gap:10px;padding:18px;border-bottom:1px solid var(--border)}.modal-body{padding:18px;overflow:auto}.close{border:0;background:transparent;color:var(--text);font-size:24px;cursor:pointer}.evidence{display:grid;gap:8px}.evidence a{color:var(--accent);text-decoration:none}.empty{color:var(--muted);padding:28px 8px;text-align:center}.subscribe{display:flex;gap:8px}.subscribe input{flex:1;border:1px solid var(--border);border-radius:10px;padding:10px 12px;background:transparent;color:var(--text)}.subscribe button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:white;cursor:pointer}.foot{font-size:12px;color:var(--muted);margin:16px 2px 4px}
    @media(max-width:860px){.grid4{grid-template-columns:1fr 1fr}.main-grid,.content-grid{grid-template-columns:1fr}.wrap{padding:15px}.brand h1{font-size:24px}}@media(max-width:480px){.grid4{grid-template-columns:1fr 1fr}.metric strong{font-size:21px}.top{align-items:center}.sub{max-width:250px}.chart{height:190px}}
  </style>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="brand"><h1>Trend Radar</h1><div class="sub">跨平台实时趋势 · 热度变化 · AI 解析 · 可行动机会</div></div><div class="live"><span class="dot"></span><span id="liveText">连接中</span></div></header>
  <nav class="toolbar" id="filters"><button class="active" data-cat="全部">全部</button><button data-cat="AI">AI</button><button data-cat="科技">科技</button><button data-cat="财经">财经</button><button data-cat="消费">消费</button><button data-cat="社会">社会</button><button data-cat="娱乐">娱乐</button><button data-cat="游戏">游戏</button><button data-cat="体育">体育</button></nav>

  <section class="grid4">
    <div class="metric"><small>活跃趋势</small><strong id="mTopics">—</strong></div>
    <div class="metric"><small>Breakout ≥ 70</small><strong id="mBreakout">—</strong></div>
    <div class="metric"><small>在线数据源</small><strong id="mSources">—</strong></div>
    <div class="metric"><small>平均趋势指数</small><strong id="mScore">—</strong></div>
  </section>

  <section class="main-grid">
    <div class="panel"><h2>24 小时趋势强度</h2><div class="chart" id="timeline"></div><div class="legend"><span><i></i>综合热度</span><span class="b"><i></i>Breakout</span></div></div>
    <div class="panel"><h2>类别分布</h2><div class="bars" id="categoryBars"></div></div>
  </section>

  <section class="content-grid">
    <div class="panel"><h2>🔥 当前热度</h2><div class="trend-list" id="hotList"></div></div>
    <div class="panel"><h2>🚀 正在冒头</h2><div class="trend-list" id="breakoutList"></div></div>
  </section>

  <section class="content-grid">
    <div class="panel"><h2>数据源健康</h2><div class="sources" id="sources"></div></div>
    <div class="panel"><h2>每日邮件</h2><p class="sub">订阅每日精选趋势。MVP 先保存订阅，配置 Resend 后自动发送。</p><div class="subscribe"><input id="email" type="email" placeholder="you@example.com"><button id="subscribeBtn">订阅</button></div><div class="sub" id="subscribeMsg"></div></div>
  </section>

  <div class="foot">Trend Radar 只把热度当作需求信号之一；AI 机会分析不构成投资建议或收益保证。</div>
</div>

<dialog id="detail"><div class="modal-head"><div><div class="chip" id="dMeta"></div><h2 id="dTitle" style="margin:7px 0 0"></h2></div><button class="close" id="closeDetail">×</button></div><div class="modal-body"><h3>AI 解析</h3><p id="dSummary"></p><p id="dWhy" class="summary"></p><h3>可行动机会</h3><div id="dOpps"></div><h3>证据源</h3><div class="evidence" id="dEvidence"></div></div></dialog>

<script>
const state={data:null,category:'全部'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtTime(iso){if(!iso)return '尚未采集';const d=new Date(iso);return d.toLocaleString('zh-CN',{hour12:false,month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function renderLine(rows){const el=$('#timeline');if(!rows.length){el.innerHTML='<div class="empty">采集两轮后开始形成趋势曲线</div>';return}const w=720,h=210,p=28;const vals=rows.flatMap(x=>[Number(x.score||0),Number(x.breakout||0)]);const max=Math.max(100,...vals),min=0;const x=i=>p+(w-p*2)*(i/Math.max(1,rows.length-1));const y=v=>h-p-(h-p*2)*((v-min)/(max-min));const path=k=>rows.map((r,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(Number(r[k]||0)).toFixed(1)).join(' ');const labels=[0,25,50,75,100];el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="24小时趋势曲线">${labels.map(v=>`<line class="axis" x1="${p}" y1="${y(v)}" x2="${w-p}" y2="${y(v)}"/><text class="chart-label" x="2" y="${y(v)+4}">${v}</text>`).join('')}<path class="line1" d="${path('score')}"/><path class="line2" d="${path('breakout')}"/>${rows.filter((_,i)=>i===0||i===rows.length-1||i===Math.floor(rows.length/2)).map((r,i,a)=>`<text class="chart-label" x="${x(rows.indexOf(r))-12}" y="${h-4}">${new Date(r.t).getHours()}:00</text>`).join('')}</svg>`}
function topicCard(t){const opp=t.opportunities?.[0];return `<div class="trend" data-id="${esc(t.id)}"><div class="trend-top"><div class="trend-title">${esc(t.canonical_title)}</div><strong>${Math.round(t.current_score)}</strong></div><div class="chips"><span class="chip">${esc(t.category)}</span><span class="chip ${t.breakout_score>=70?'rise':''}">Breakout ${Math.round(t.breakout_score)}</span><span class="chip">${t.source_count} 源</span><span class="chip ${t.status==='hot'?'hot':''}">${esc(t.status)}</span></div>${t.ai_summary?`<div class="summary">${esc(t.ai_summary)}</div>`:''}${opp?`<div class="opp"><b>机会</b> · ${esc(opp.idea)}</div>`:''}</div>`}
function render(){const d=state.data;if(!d)return;const topics=d.topics||[];$('#mTopics').textContent=topics.length;$('#mBreakout').textContent=topics.filter(x=>x.breakout_score>=70).length;const live=d.sources.filter(s=>s.last_success_at&&!s.last_error).length;$('#mSources').textContent=`${live}/${d.sources.length}`;$('#mScore').textContent=topics.length?Math.round(topics.reduce((a,b)=>a+Number(b.current_score||0),0)/topics.length):0;renderLine(d.timeline||[]);const max=Math.max(1,...(d.categories||[]).map(x=>Number(x.count||0)));$('#categoryBars').innerHTML=(d.categories||[]).slice(0,8).map(x=>`<div class="bar-row"><span>${esc(x.category)}</span><div class="track"><div class="fill" style="width:${Number(x.count)/max*100}%"></div></div><b>${x.count}</b></div>`).join('')||'<div class="empty">暂无分类数据</div>';const hot=[...topics].sort((a,b)=>b.current_score-a.current_score).slice(0,12);const breakout=[...topics].sort((a,b)=>b.breakout_score-a.breakout_score).slice(0,12);$('#hotList').innerHTML=hot.map(topicCard).join('')||'<div class="empty">第一次采集完成后显示热点</div>';$('#breakoutList').innerHTML=breakout.map(topicCard).join('')||'<div class="empty">至少两轮采集后更有意义</div>';$('#sources').innerHTML=d.sources.map(s=>{const ok=s.last_success_at&&(!s.last_error_at||new Date(s.last_success_at)>=new Date(s.last_error_at));return `<div class="source"><span>${esc(s.name)} <small class="sub">${esc(s.kind)}</small></span><span class="status ${ok?'ok':s.last_error?'bad':'wait'}">${ok?'● '+s.last_item_count+' 条 · '+fmtTime(s.last_success_at):s.last_error?'● 异常':'○ 待接入'}</span></div>`}).join('');document.querySelectorAll('.trend').forEach(el=>el.addEventListener('click',()=>openDetail(el.dataset.id)));$('#liveText').textContent='更新于 '+new Date(d.generatedAt).toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit'})}
async function load(){try{const q=state.category==='全部'?'':'?category='+encodeURIComponent(state.category);const r=await fetch('/api/dashboard'+q);if(!r.ok)throw new Error('HTTP '+r.status);state.data=await r.json();render()}catch(e){$('#liveText').textContent='API 尚未初始化';console.error(e)}}
async function openDetail(id){const r=await fetch('/api/topic/'+encodeURIComponent(id));if(!r.ok)return;const t=await r.json();$('#dTitle').textContent=t.canonical_title;$('#dMeta').textContent=`${t.category} · 热度 ${Math.round(t.current_score)} · Breakout ${Math.round(t.breakout_score)}`;$('#dSummary').textContent=t.ai_summary||'等待 AI 分析';$('#dWhy').textContent=t.ai_why_now||'';$('#dOpps').innerHTML=(t.opportunities||[]).map(o=>`<div class="trend"><b>${esc(o.type)} · ${esc(o.idea)}</b><div class="summary">${esc(o.rationale)} · 难度 ${esc(o.difficulty)} · ${esc(o.time_to_market)} · 置信 ${Number(o.confidence||0)}%</div></div>`).join('')||'<div class="empty">暂无机会分析</div>';$('#dEvidence').innerHTML=(t.sources||[]).map(s=>`<div><span class="chip">${esc(s.source_id)} #${s.rank||'-'}</span> ${s.url?`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`:esc(s.title)}</div>`).join('')||'<div class="empty">暂无证据</div>';$('#detail').showModal()}
$('#closeDetail').addEventListener('click',()=>$('#detail').close());$('#filters').addEventListener('click',e=>{if(!e.target.dataset.cat)return;document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');state.category=e.target.dataset.cat;load()});$('#subscribeBtn').addEventListener('click',async()=>{const email=$('#email').value.trim();$('#subscribeMsg').textContent='提交中…';try{const r=await fetch('/api/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email,categories:[state.category]})});const b=await r.json();$('#subscribeMsg').textContent=r.ok?'订阅已保存':'订阅失败：'+(b.error||r.status)}catch(e){$('#subscribeMsg').textContent='订阅失败'}});load();setInterval(load,60000);
</script>
</body>
</html>
